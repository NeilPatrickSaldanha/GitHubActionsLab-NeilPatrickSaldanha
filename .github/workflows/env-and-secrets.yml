name: Environment Variables and Secrets Workflow

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: production

jobs:
  deploy-to-aws:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_NAME: MyApp-Deploy
    
    steps:
      - name: Display Workflow Environment Variables
        run: |
          echo "AWS Region: ${{ env.AWS_REGION }}"
          echo "Environment: ${{ env.ENVIRONMENT }}"
      
      - name: Access AWS Credentials
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS Access Key ID: $AWS_ACCESS_KEY"
          echo "AWS Secret Access Key: $AWS_SECRET_KEY"
      
      - name: Set and Use Step Variable
        env:
          STEP_VAR: step-level-value
        run: |
          echo "Step Variable: $STEP_VAR"
      
      - name: Demonstrate Variable Scopes
        env:
          STEP_SPECIFIC: only-in-this-step
        run: |
          echo "=== Workflow Level ==="
          echo "AWS_REGION: ${{ env.AWS_REGION }}"
          echo "ENVIRONMENT: ${{ env.ENVIRONMENT }}"
          echo "=== Job Level ==="
          echo "DEPLOYMENT_NAME: ${{ env.DEPLOYMENT_NAME }}"
          echo "=== Step Level ==="
          echo "STEP_SPECIFIC: $STEP_SPECIFIC"